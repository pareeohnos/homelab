[defaults]
inventory = inventory
roles_path = ./roles
remote_user = ansible

[ssh_connection]
# Long, quiet tasks (large downloads, installers that produce no output
# for minutes) were getting silently dropped mid-task - "Connection
# closed by UNKNOWN port 65535" - on hosts reached over the Tailscale
# tunnel, matching the same idle-timeout pattern diagnosed for
# pulumi-command's SSH connection in apps/home_assistant.ts. These
# keepalives keep the connection active during silent stretches
# regardless of what's producing (or not producing) task output.
ssh_args = -o ServerAliveInterval=15 -o ServerAliveCountMax=3
