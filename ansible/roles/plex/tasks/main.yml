---
- name: Create user and group
  include_tasks: user.yml

- name: Install Plex
  include_tasks: install.yml

- name: Configure and start Plex service
  include_tasks: service.yml

- name: Setup reverse proxy
  include_role:
    name: caddy
  vars:
    caddy_url: lxc-plex-01.home.hooper.co.uk
    caddy_ports:
      - port: 32400

# Owned by plex:plex (the package's own fixed user/group, confirmed via
# `systemctl cat plexmediaserver`) - not plex_group, which here means the
# shared "media" group added as a supplementary membership, unrelated to
# what actually owns Plex's own log files.
- name: Configure log rotation
  include_role:
    name: logrotate
  vars:
    logrotate_name: plexmediaserver
    logrotate_paths:
      - '/var/lib/plexmediaserver/Library/Application Support/Plex Media Server/Logs/*.log'
    logrotate_create_owner: "{{ plex_user }}"
    logrotate_create_group: "{{ plex_user }}"
