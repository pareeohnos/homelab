---
# Must happen before the user/group tasks below - usermod/groupmod can't
# change an id while a process (the sonarr service, running as this user)
# is still using it.
- name: Stop Sonarr service if currently running
  become: true
  systemd:
    name: sonarr
    state: stopped
  failed_when: false
  register: sonarr_stop_result
  changed_when: sonarr_stop_result.status is defined

- name: Create sonarr group
  become: true
  group:
    name: "{{ sonarr_group }}"
    gid: "{{ sonarr_gid }}"
    state: present

- name: Create sonarr system user
  become: true
  user:
    name: "{{ sonarr_user }}"
    uid: "{{ sonarr_uid }}"
    group: "{{ sonarr_group }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin

# recurse: true so that if sonarr_uid/sonarr_gid ever change on an
# already-deployed host, existing data doesn't end up orphaned under the
# old numeric id.
- name: Create AppData directory
  become: true
  file:
    path: "{{ sonarr_datadir }}"
    state: directory
    owner: "{{ sonarr_user }}"
    group: "{{ sonarr_group }}"
    mode: '0775'
    recurse: true
