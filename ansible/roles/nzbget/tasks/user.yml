---
# Must happen before the user/group tasks below - usermod/groupmod can't
# change an id while a process (the nzbget service, running as this user)
# is still using it.
- name: Stop NZBGet service if currently running
  become: true
  systemd:
    name: nzbget
    state: stopped
  failed_when: false
  register: nzbget_stop_result
  changed_when: nzbget_stop_result.status is defined

- name: Create nzbget group
  become: true
  group:
    name: "{{ nzbget_group }}"
    gid: "{{ nzbget_gid }}"
    state: present

- name: Create nzbget system user
  become: true
  user:
    name: "{{ nzbget_user }}"
    uid: "{{ nzbget_uid }}"
    group: "{{ nzbget_group }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
