---
- name: Assert nzbget_control_password is set
  assert:
    that:
      - nzbget_control_password | length > 0
    fail_msg: >-
      nzbget_control_password must be set (via group_vars/all/vault.yml) -
      NZBGet's built-in default credentials are publicly documented.

- name: Create user and group
  include_tasks: user.yml

- name: Download NZBGet installer
  include_tasks: download.yml

- name: Install NZBGet
  include_tasks: install.yml

- name: Configure NZBGet
  include_tasks: configure.yml

- name: Configure and start NZBGet service
  include_tasks: service.yml

- name: Setup reverse proxy
  include_role:
    name: caddy
  vars:
    caddy_url: lxc-nzbget-01.home.hooper.co.uk
    caddy_ports:
      - port: 6789
