---
- name: Assert nzbget_control_password is set
  assert:
    that:
      - nzbget_control_password | length > 0
    fail_msg: >-
      nzbget_control_password must be set (via group_vars/all/vault.yml) -
      NZBGet's built-in default credentials are publicly documented.

- name: Create user and group
  include_tasks: user.yml

- name: Download NZBGet installer
  include_tasks: download.yml

- name: Install NZBGet
  include_tasks: install.yml

- name: Configure NZBGet
  include_tasks: configure.yml

- name: Configure and start NZBGet service
  include_tasks: service.yml

- name: Setup reverse proxy
  include_role:
    name: caddy
  vars:
    caddy_url: lxc-nzbget-01.home.hooper.co.uk
    caddy_ports:
      - port: 6789

# NZBGet's LogFile setting (nzbget.conf) defaults to ${MainDir}/nzbget.log,
# and MainDir was pointed at the shared NFS mount in configure.yml (for
# hardlinking to work) - so this log lives on the NAS alongside downloads,
# not on local storage. logrotate handles that fine (NFS supports the
# same rename/create operations it uses), but worth knowing if you ever
# reconsider where the log itself should live.
- name: Configure log rotation
  include_role:
    name: logrotate
  vars:
    logrotate_name: nzbget
    logrotate_paths:
      - "{{ nzbget_maindir }}/nzbget.log"
    logrotate_create_owner: "{{ nzbget_user }}"
    logrotate_create_group: "{{ nzbget_group }}"
