---
- name: Determine system architecture
  command: dpkg --print-architecture
  register: dpkg_arch
  changed_when: false

- name: Map dpkg architecture to Radarr arch parameter
  set_fact:
    radarr_arch: >-
      {{ 'x64' if dpkg_arch.stdout == 'amd64' else
         'arm' if dpkg_arch.stdout == 'armhf' else
         'arm64' if dpkg_arch.stdout == 'arm64' else
         'unsupported' }}

- name: Fail if architecture is unsupported
  fail:
    msg: "Architecture {{ dpkg_arch.stdout }} is not supported by Radarr"
  when: radarr_arch == 'unsupported'

- name: Download and extract Radarr release
  unarchive:
    src: "https://radarr.servarr.com/v1/update/{{ radarr_branch }}/updatefile?os=linux&runtime=netcore&arch={{ radarr_arch }}"
    dest: /tmp
    remote_src: true
  register: radarr_extract
