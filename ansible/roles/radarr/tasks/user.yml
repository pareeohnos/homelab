---
# Must happen before the user/group tasks below - usermod/groupmod can't
# change an id while a process (the radarr service, running as this user)
# is still using it.
- name: Stop Radarr service if currently running
  become: true
  systemd:
    name: radarr
    state: stopped
  failed_when: false
  register: radarr_stop_result
  changed_when: radarr_stop_result.status is defined

- name: Create radarr group
  become: true
  group:
    name: "{{ radarr_group }}"
    gid: "{{ radarr_gid }}"
    state: present

- name: Create radarr system user
  become: true
  user:
    name: "{{ radarr_user }}"
    uid: "{{ radarr_uid }}"
    group: "{{ radarr_group }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin

# recurse: true so that if radarr_uid/radarr_gid ever change on an
# already-deployed host, existing data doesn't end up orphaned under the
# old numeric id.
- name: Create data directory
  become: true
  file:
    path: "{{ radarr_datadir }}"
    state: directory
    owner: "{{ radarr_user }}"
    group: "{{ radarr_group }}"
    mode: '0775'
    recurse: true
