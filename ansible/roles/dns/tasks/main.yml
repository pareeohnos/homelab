- name: Install dependencies
  include_tasks: dependencies.yml

- name: Create technitium user
  include_tasks: user.yml

- name: Install technitium
  include_tasks: install.yml

- name: Firewall
  include_tasks: firewall.yml

- name: Configure log rotation
  include_role:
    name: logrotate
  vars:
    logrotate_name: technitium
    logrotate_paths:
      - /etc/dns/logs/*.log
    logrotate_create_owner: technitium
    logrotate_create_group: technitium
